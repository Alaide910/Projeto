<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Somando Valores</title>
  </head>
  <body>
    <script>
      function soma(...numero) {
        let total = 0;
        for (const n of numero) {
          total += n;
        }
        return total;
      }
      console.log(soma(10, 20, 30));
    </script>

  </body>
</html>
